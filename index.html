        }

        /* messing around with the font */
        p {

        /* Using a table cuz its simpler than some css shi */
        .logo-table {
            width: 100%;
            height: 140px; 
            background-color: #7dd3fc;
            border-collapse: collapse;
            border: none;
            margin: 0;
        }

        .logo-table td {
            padding: 0;
            text-align: center;
            width: 100%;
            height: 100%;
        }

        /* The logog is a png so yk */
        .logo {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: fill; 
        }

        /* Bar Le Navigation */
        .nav-bar {
            background-color: #005b94;
            color: #ffffff;
            text-align: center;
            padding: 8px 0;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 2px;
            border-top: 2px solid #000000;
            border-bottom: 2px solid #000000;
        }

        .nav-bar a {
            color: #ffffff;
            text-decoration: none;
            margin: 0 15px;
        }

        .nav-bar a:hover {
            text-decoration: underline;
        }

        /* Main Content Layout */
        .main-layout {
            max-width: 900px;
            margin: 20px auto;
            padding: 0 20px;
            position: relative;
            overflow: hidden;
        }

        .left-content {
            width: 60%;
            float: left;
        }

        .right-content {
            width: 35%;
            float: right;
            text-align: center;
            margin-top: 40px;
        }

        /* ONLY this header uses Comic Sans MS */
        h1 {
            font-family: "Comic Sans MS", cursive, sans-serif;
            font-size: 28px;
            margin-bottom: 5px;
        }

        .user-count {
            font-size: 14px;
            margin-top: 0;
            margin-bottom: 30px;
            margin-left: 20px;
        }

        /* le gifs */
        .features-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 40px;
            max-width: 450px;
        }

        .feature-item {
            text-align: center;
        }

        .feature-icon {
            width: 80px;
            height: 60px;
            display: block;
            margin: 0 auto;
        }

        /* Le buttons */
        .button-container {
            margin-bottom: 20px;
        }

        .action-button {
            border: none;
            background: none;
            padding: 0;
            cursor: pointer;
            display: inline-block;
            margin-right: 20px;
            margin-bottom: 15px;
        }

        .action-button img {
            width: 200px;
            height: auto;
        }

        .platform-info {
            font-size: 13px;
            margin-top: 20px;
        }

        .platform-info span {
            font-size: 11px;
            display: block;
            color: #333333;
        }

        /* Char image */
        .character-avatar {
            max-width: 100%;
            height: auto;
        }

        /* Clearfix for layout le float */
        .clearfix::after {
            content: "";
            clear: both;
            display: table;
        }
